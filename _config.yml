# Site-wide settings. Jekyll does NOT pick up changes here while `jekyll serve`
# is running — restart the server after editing this file.

title: Nathaniel Ver Steeg
# Not shown on the page. This is the grey snippet under your title in Google
# results, and the preview text when someone pastes your link into Slack.
description: >-
  Nathaniel Ver Steeg is a PhD candidate at Berkeley Haas researching industrial
  organization, microeconomic theory, and market power in digital markets.
# Must stay in sync with the CNAME file at the repo root. This feeds
# absolute_url, which builds every page's <link rel="canonical">. If the two
# ever disagree, search engines get told the wrong address is authoritative.
url: "https://nathanielversteeg.com"
baseurl: ""

markdown: kramdown

# REQUIRED. The github-pages gem forces `theme: jekyll-theme-primer` unless a
# `theme` key is actually present, and Primer's assets/css/style.scss compiles
# to the same path as our own assets/css/style.css and clobbers it. Deleting
# this line silently restores Primer, locally and on GitHub Pages.
theme: null

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
